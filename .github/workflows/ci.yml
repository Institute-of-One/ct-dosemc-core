name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The extras, not a hand-written list beside them. CI used to name
      # pypandoc_binary and pillow itself, so the [paper] extra was never
      # installed and never tested: python-docx was missing from it for weeks
      # and the only thing that noticed was a reader's fresh checkout.
      #
      # pypandoc_binary carries the pandoc executable, so the .docx tests run
      # here rather than skipping. Page and line numbering exist only in the
      # artefact that reaches an editor, and a companion submission was returned
      # before peer review for the want of them.
      - name: Install the package and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,paper]"

      - name: Pytest
        run: pytest -q

      # The manuscript is rebuilt from the frozen results on every push, and the
      # checks run in --strict. A number that has drifted from the run that
      # produced it fails the build rather than reaching a reader.
      - name: Rebuild and check the manuscript
        if: ${{ !cancelled() }}
        run: python paper/build_all.py

      # Lint is scoped to the paper build and the analysis behind it. The rest of
      # the tree predates any enforcement and carries 24 findings; fixing them is
      # worth doing and is not worth doing in the week a manuscript goes out, so
      # the scope is declared here rather than the check quietly weakened.
      #
      # It runs last, and the steps above run whatever it does. It used to run
      # first, so from 2026-10-21 a newer ruff's import-sorting findings failed
      # the job before a single test had run: five pushes in a row, the v0.2.1
      # release among them, reported "CI failed" while saying nothing at all
      # about whether the code worked. A style gate must never be able to
      # silence a correctness gate.
      - name: Ruff (paper build and analysis)
        if: ${{ !cancelled() }}
        run: |
          ruff check paper tools/conversion_ceiling.py \
            tests/test_conversion_ceiling.py tests/test_presubmission_check.py \
            tests/test_docx_numbering.py tests/test_build_info_kinds.py
          ruff format --check paper tools/conversion_ceiling.py \
            tests/test_conversion_ceiling.py tests/test_presubmission_check.py \
            tests/test_docx_numbering.py tests/test_build_info_kinds.py
