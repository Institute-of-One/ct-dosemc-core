[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ct-dosemc-core"
version = "0.1.0.dev0"
description = "Patient-specific absorbed organ dose in CT (mGy) by open Monte Carlo: MC-GPU transport through a segmented, density-mapped patient phantom, with per-value provenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Institute of One, LISIT Co., Ltd." }]
keywords = [
  "CT",
  "Monte Carlo",
  "organ dose",
  "absorbed dose",
  "MC-GPU",
  "SpekPy",
  "CTDI",
  "dosimetry",
  "TotalSegmentator",
  "DICOM",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23",
  "pydicom>=2.3",
  # ndimage, for the body contour and the isotropic resample. It was imported
  # by patient.py and phantom.py and declared nowhere, so a fresh install of
  # this package could not run the pipeline the paper describes.
  "scipy>=1.10",
]

[project.optional-dependencies]
# SpekPy generates every spectrum used here.  It is a hard requirement for any
# absolute dose, and an extra only so that the geometry layer imports without it.
spectra = ["spekpy>=2.0"]
# TotalSegmentator is inference-only and is always run as a separate process
# (spawning it inside a long-lived parent deadlocks on Windows), so it is never
# imported by this package.
seg = ["TotalSegmentator>=2.0", "nibabel>=5.0"]
# Data acquisition works over the public NBIA REST API with the standard library.
tcia = ["tcia_utils>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Institute-of-One/ct-dosemc-core"
Issues = "https://github.com/Institute-of-One/ct-dosemc-core/issues"
Documentation = "https://github.com/Institute-of-One/ct-dosemc-core#readme"

[tool.hatch.build.targets.wheel]
packages = ["ct_dosemc_core"]

[tool.hatch.build.targets.sdist]
include = [
  "ct_dosemc_core",
  "tests",
  "tools",
  "docs",
  "results",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "engine: needs a built MC-GPU executable (tools/build_mcgpu.ps1)",
  "materials: needs the generated material files (tools/make_materials.py)",
  "slow: a full Monte-Carlo run rather than a unit check",
  "network: needs network access to the TCIA NBIA API",
  "local_data: needs the downloaded series described by data/PROVENANCE.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
